# Confidence-Triggered Re-localization (CTR, Sec. 2.3): Motion Center Correction (MCC)
# + Residual-Guided Target Correction (RGTC). Inference only, no trainable parameters.
- path: "run.runner.test.evaluator.pipeline.ctr"
  value:
    enabled: true
    mcc_enabled: true
    rgtc_enabled: true
    confidence_threshold: 0.40        # tau
    # homography T_t shared by MCC and RGTC (ORB + Hamming matching + RANSAC)
    orb_features: 800
    max_matches: 80
    min_matches: 8
    min_inlier_ratio: 0.25
    ransac_reproj_threshold: 2.0      # pixels
    max_center_shift_ratio: 1.0
    # RGTC foreground evidence M_t = M_t^mog2 U M_t^res (Eqs. 4-6)
    residual_mad_scale: 4.4478        # alpha in Eq. (5)
    mog2_history: 80
    mog2_var_threshold: 24.0
    mog2_detect_shadows: true
    # candidate area constraints relative to the previous target area
    min_candidate_area: 4.0
    min_candidate_area_ratio: 0.05
    max_candidate_area_ratio: 25.0
    # Choose the nearest area-qualified rectangle to the MCC center.
    print_summary: true
- path: "run.data.eval.transform.with_full_template_image"
  value: true
- path: "logging.tags"
  action: "append"
  value: "ctr"
- path: "name"
  action: "append"
  value: "-ctr"
- path: "run.data.test.transform.with_full_template_image"
  value: true
