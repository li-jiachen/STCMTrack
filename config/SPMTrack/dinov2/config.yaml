name: "SPMTrack/DINOv2-B-378"

logging:
  category: "SPMTrack"
  tags:
    - "DINOv2"
    - "base"
    - "378"
    - "TMoE"
    - "baseline"

type: "SPMTrack"

common:
  template_size: [ 196, 196 ]
  search_region_size: [ 378, 378 ]
  template_feat_size: [ 14, 14 ]
  search_region_feat_size: &search_region_feat_size [ 27, 27 ]
  response_map_size: *search_region_feat_size
  template_feat_data_layout: "NLC"
  interpolation_mode: "bilinear"
  interpolation_align_corners: false
  normalization: "imagenet"

model:
  template_feat_size: [14, 14]
  type: "dinov2"
  # Checkpoints written by this code carry `_spmtrack_port_version`. A checkpoint without it (for example the
  # official SPMTrack release) is refused unless this is set to true, which declares that it was trained with
  # the official SPMTrack code. STCMTrack checkpoints are always refused.
  allow_unmarked_weights: false
  backbone:
    type: "DINOv2"
    parameters:
      name: "ViT-B/14"
      acc: "default"
      use_moe: false
  tmoe:
    r: 64
    alpha: 64
    dropout: 0.
    use_rsexpert: false
    shared_expert: false
    route_compression: false
    expert_nums: 4
    init_method: bert

run: !include "../run.yaml"
