# SPMTrack baseline run configuration (independent of config/STCMTrack/run.yaml).
#
# Structure and inference logic: official SPMTrack, github.com/WenRuiCai/SPMTrack,
#   config/SPMTrack/run.yaml @ c581fe27231f3e16c38578e47daddadfaf6ffd7d  (three templates, two search
#   frames, "interval" pair sampling, per-image flip/color augmentation, IoU-aware classification target,
#   summed search-frame losses, per-parameter weight decay groups, Hann window 0.45, min object size 10).
# Data, training budget and evaluation shared with STCMTrack (see docs/SPMTRACK_BASELINE.md; these settings are
# not taken from upstream):
#   * datasets: the Anti-UAV410 / Anti-UAV splits of config/_dataset/*.yaml; upstream's GOT-10k / LaSOT /
#     TrackingNet / COCO paths and sampling weights are not used;
#   * training budget: 80 epochs, global batch 4, 2048 train / 4096 val samples per epoch (the stage-1 budget
#     of Sec. 3.1; upstream uses 170 epochs, batch 128, 131072 samples), torch.compile off like the rest of
#     this repository, efficiency assessment off;
#   * evaluation: the shared one_pass_evaluation_compatible handler and PyTracking export (metrics of Sec. 3.2).

type: "default"

num_epochs: 80

efficiency_assessment:
  enabled: false
  latency:
    auto_mixed_precision:
      enabled: true

checkpoint:
  - type: "regular"
    epoch_trigger:
      interval: 20
      last: true
    resumable: false
    max_to_keep: 5

task:
  train:
    is_train: true
    data: "train"
    runner: "train"
    logging:
      interval: 50
      local:
        header: "Epoch: [{epoch}]"
      wandb:
        with_epoch: true

  val:
    is_train: false
    data: "val"
    runner: "train"
    logging:
      interval: 10
      metric_prefix: "val_"
      local:
        header: "Val"
        auto_summary: true
      wandb:
        per_iteration_logging:
          enabled: false
        per_epoch_logging:
          enabled: true
          summary_method: "mean"

  test:
    is_train: false
    data: "test"
    runner: "test"
    epoch_trigger:
      last: true
    logging:
      interval: 100
      metric_prefix: "test_"
      local:
        header: "Test"

  eval:
    is_train: false
    data: "eval"
    runner: "test"
    epoch_trigger:
      last: true
    logging:
      interval: 100
      local:
        header: "Eval"
    batch_collective_communication:
      type: "time"
      interval: 10

data:
  train:
    global_batch_size: 4
    num_io_threads: !const "num_io_threads_per_worker"
    num_workers: !const "num_train_workers"

    type: "siamese_tracker_train"

    source:
      type: "dataset"
      parameters:
        !include "../_dataset/train.yaml"

    sampler:
      type: "random"

      samples_per_epoch: 2048

    siamese_training_pair_sampling: &siamese_training_pair_sampling
      positive_sample:
        sample_mode: "interval"
        max_gaps: 200
        num_template_frames: 3
        num_search_frames: 2
        MAX_SAMPLE_INTERVAL: 400
        auto_extend:
          step: 5
          max_retry_count: 20

    transform: &transform_options
      type: "default"

      SiamFC_cropping:
        template:
          area_factor: 2.
        search_region:
          area_factor: 5.
          scale_jitter: 0.25
          translation_jitter: 3
          min_object_size: 10

      augmentation:
        - type: "horizontal_flip"
          target: ["template_0", "template_1", "template_2", "search_region_0", "search_region_1"]
          probability: 0.5
          joint: false
        - type: "color_jitter"
          target: ["template_0", "template_1", "template_2", "search_region_0", "search_region_1"]
          brightness: 0.4
          contrast: 0.4
          saturation: 0.4
          joint: false
        - type: "DeiT_3_aug"
          target: ["template_0", "template_1", "template_2", "search_region_0", "search_region_1"]
          joint: true
      plugin:
        - type: "box_with_score_map_label_generation"
        - type: "template_foreground_indicating_mask_generation"

      visualize: false
  val:
    global_batch_size: 4
    num_io_threads: !const "num_io_threads_per_worker"
    num_workers: !const "num_val_workers"

    type: "siamese_tracker_train"

    source:
      type: "dataset"
      parameters:
        !include "../_dataset/val.yaml"

    sampler:
      type: "random"
      samples_per_epoch: 4096

    siamese_training_pair_sampling: *siamese_training_pair_sampling

    transform: *transform_options

  test:
    batch_size: 8
    num_io_threads: !const "num_io_threads_per_worker"
    num_workers: !const "num_eval_workers"

    type: "siamese_tracker_eval"

    source:
      type: "dataset"
      parameters:
        !include "../_dataset/test.yaml"

    sampler:
      type: "distributed_dynamic_scheduling"
      shuffle: false

    transform:
      type: "default"
      template_area_factor: 2.0

    result_collector:
      async_worker: true
      log_summary: false
      dispatch:
        - match:
            name_regex: ".*"
          handlers:
            - type: "one_pass_evaluation_compatible"
              file_name: "ope_results"

  eval:
    batch_size: 8
    num_io_threads: !const "num_io_threads_per_worker"
    num_workers: !const "num_eval_workers"

    type: "siamese_tracker_eval"

    source:
      type: "dataset"
      parameters:
        !include "../_dataset/test.yaml"

    sampler:
      type: "distributed_dynamic_scheduling"
      shuffle: true
      repeat_times:
        - match:
            type: "dataset"
            name_regex: ".*"
          value: 1

    transform:
      type: "default"
      template_area_factor: 2.0

    result_collector:
      async_worker: true
      log_summary: true
      dispatch:
        - match:
            name_regex: ".*"
          handlers:
            - type: "one_pass_evaluation_compatible"
            - type: "external/PyTracking"
              file_name: "results"

runner:
  train:
    type: "default_train"

    optimization:
      optimizer:
        type: "AdamW"
        lr: 1.e-4
        weight_decay: 0.1
        fused: false
        per_parameter:
          - type: "zero_1d_param_weight_decay"
          - name_regex: "embed"
            weight_decay: 0.
      grad_accumulation_steps: 1
      max_grad_norm: 1.0
      zero_grad_set_to_none: true
      lr_scheduler:
        type: "timm"
        sched: "cosine"
        per_iteration: true
        parameters:
          lr_min: 1.e-6
          warmup_prefix: true
          warmup_epochs: 2
          warmup_lr: 1.e-7
      auto_mixed_precision:
        enabled: true
        dtype: float16

    torch_compile:
      enabled: false
    detect_unused_parameters: false

    criteria:
      type: "box_with_score_map"
      frame_loss_reduction: "sum"   # official SPMTrack adds the two search-frame losses
      classification:
        type: "binary_cross_entropy"
        iou_aware_classification_score: true
        weight: 1.
      bbox_regression:
        type: "GIoU"
        weight: 1.
        warmup_epochs: 0

  test:
    type: "default_eval"
    inference_engine:
      type: "plain"
      auto_mixed_precision:
        enabled: true
      torch_compile:
        enabled: false
    evaluator:
      type: "default"
      pipeline:
        type: "spmtrack_one_stream_tracker"
        search_region_cropping:
          type: "simple"
          min_object_size: 10
          area_factor: 5.0
        online_template:
          area_factor: 2.0
        post_process:
          type: "box_with_score_map_spmtrack"
          window_penalty: 0.45
        visualization: false

        plugin:
          - type: "template_foreground_indicating_mask_generation"
