# Train / validate / test on the infrared videos of Anti-UAV (`antiuav300` in the scripts) instead of Anti-UAV410.
# Prepare the data with tools/prepare_antiuav.py and set the ANTIUAV300_* paths in consts.yaml.
# Place this mixin before `evaluation` and `eval_short`.
- path: "run.data.train.source.parameters.datasets"
  value:
    - name: "AntiUAV300_Train"
      type: "SOT"
      splits: ["train"]
- path: "run.data.val.source.parameters.datasets"
  value:
    - name: "AntiUAV300_Val"
      type: "SOT"
      splits: ["val"]
- path: "run.data.test.source.parameters.datasets"
  value:
    - name: "AntiUAV300"
      type: "SOT"
      splits: ["test"]
- path: "run.data.eval.source.parameters.datasets"
  value:
    - name: "AntiUAV300"
      type: "SOT"
      splits: ["test"]
- path: "logging.tags"
  action: "append"
  value: "antiuav300"
- path: "name"
  action: "append"
  value: "-antiuav300"
